# Lints CLAUDE.md, .claude/commands, skills, agents and settings with claude-rules-linter.
# Report only: results go to the job log and the job summary page; the job never fails.
# This repo is public, and GitHub doesn't let public repos use actions from a private repo,
# so this runs the linter from npm. It skips with a notice until the package is published.
# To enforce later, add `--fail-under 90` or `--fail-on error` to the crl command.
name: Claude rules lint

on:
  pull_request:
    paths:
      - "**/CLAUDE.md"
      - "**/SKILL.md"
      - ".claude/**"
      - "**/.claude/**"
      - ".github/workflows/claude-rules.yml"
  push:
    branches: [main]
    paths:
      - "**/CLAUDE.md"
      - "**/SKILL.md"
      - ".claude/**"
      - "**/.claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run claude-rules-linter
        run: |
          if ! npm view claude-rules-linter version > /dev/null 2>&1; then
            echo "::notice::claude-rules-linter is not published to npm yet; skipping."
            exit 0
          fi
          npx --yes claude-rules-linter@0 . --summary "$GITHUB_STEP_SUMMARY"
