# Lints CLAUDE.md, .claude/commands, skills, agents and settings with claude-rules-linter.
# Report only: results go to the job log and the job summary page; the job never fails.
# To enforce later, add e.g. `fail-under: "90"` or `fail-on: error` under `with:`.
name: Claude rules lint

on:
  pull_request:
    paths:
      - "**/CLAUDE.md"
      - "**/SKILL.md"
      - ".claude/**"
      - "**/.claude/**"
      - ".github/workflows/claude-rules.yml"
  push:
    branches: [main]
    paths:
      - "**/CLAUDE.md"
      - "**/SKILL.md"
      - ".claude/**"
      - "**/.claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Rahil-Desai/claude-rules-linter@main
        with:
          # Code scanning on private repos needs GitHub Code Security, so keep SARIF upload off.
          upload-sarif: "false"
